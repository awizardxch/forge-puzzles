<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img"
     aria-label="The difference between naming a settlement's coin id in the solution, which says nothing about how much the coin holds, and deriving the id from a parent and an amount, which binds both.">
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6675"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#f7f8fa"/>
  <g font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f2430">

    <rect x="24" y="40" width="360" height="212" rx="3" fill="#ffffff" stroke="#a0a8b4" stroke-width="1.4"/>
    <text x="44" y="66" font-size="11" fill="#8a5560" letter-spacing="1.2">THE ID IS NAMED</text>
    <text x="44" y="96" font-size="11.5" font-family="DejaVu Sans Mono, Consolas, monospace">solution: settlement_coin_id</text>
    <line x1="120" y1="106" x2="120" y2="132" stroke="#5d6675" stroke-width="1.4" marker-end="url(#c)"/>
    <text x="44" y="152" font-size="11.5" font-family="DejaVu Sans Mono, Consolas, monospace">assert announcement(asset, id)</text>
    <rect x="44" y="172" width="320" height="60" rx="3" fill="#fbf0f1" stroke="#a84b57" stroke-width="1.3"/>
    <text x="204" y="193" font-size="11" fill="#a84b57" text-anchor="middle" font-weight="bold">binds the asset and the id</text>
    <text x="204" y="209" font-size="11" fill="#a84b57" text-anchor="middle">says nothing about how much it holds</text>
    <text x="204" y="225" font-size="10.5" fill="#a84b57" text-anchor="middle">a one-mojo coin passes as a 250,000 input</text>

    <rect x="416" y="40" width="360" height="212" rx="3" fill="#ffffff" stroke="#2d6b59" stroke-width="1.8"/>
    <text x="436" y="66" font-size="11" fill="#2d6b59" letter-spacing="1.2">THE ID IS DERIVED</text>
    <text x="436" y="96" font-size="11.5" font-family="DejaVu Sans Mono, Consolas, monospace">solution: parent, amount</text>
    <line x1="512" y1="106" x2="512" y2="132" stroke="#5d6675" stroke-width="1.4" marker-end="url(#c)"/>
    <text x="436" y="152" font-size="11.5" font-family="DejaVu Sans Mono, Consolas, monospace">id = coinid(parent, settle_ph, amount)</text>
    <rect x="436" y="172" width="320" height="60" rx="3" fill="#e9f2ef" stroke="#2d6b59" stroke-width="1.3"/>
    <text x="596" y="193" font-size="11" fill="#2d6b59" text-anchor="middle" font-weight="bold">assert announcement AND</text>
    <text x="596" y="209" font-size="10.5" fill="#2d6b59" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace">ASSERT_CONCURRENT_SPEND(id)</text>
    <text x="596" y="225" font-size="10.5" fill="#2d6b59" text-anchor="middle">with amount &#8805; the input being credited</text>

    <text x="24" y="278" font-size="10.5" fill="#5d6675">What this does NOT give: a settlement is not consumed by being asserted. Two actions naming one coin</text>
    <text x="24" y="292" font-size="10.5" fill="#5d6675">both pass, and conservation across the WHOLE bundle decides the pair. A network fee is slack.</text>
  </g>
</svg>
