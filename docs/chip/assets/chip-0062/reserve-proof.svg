<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" width="800" height="384" role="img"
     aria-label="Registration derives each reserve's coin id from its grandparent, which binds which coin announced, and asserts a message committing to the created puzzle hash, the amount and the launcher id, which binds what that coin did. The registry builds the expected message from the reserve hash it derives from the pool's own configuration.">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6675"/>
    </marker>
    <marker id="bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6b59"/>
    </marker>
    <marker id="bo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c6a2f"/>
    </marker>
  </defs>
  <rect width="800" height="384" fill="#f7f8fa"/>
  <g font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f2430">

    <text x="24" y="28" font-size="11" fill="#5d6675" letter-spacing="1.2">ONE LINEAGE, PER RESERVE, INSIDE THE REGISTRATION BUNDLE</text>

    <rect x="24" y="44" width="196" height="60" rx="3" fill="#ffffff" stroke="#7a8394" stroke-width="1.5"/>
    <text x="122" y="70" font-size="12.5" font-weight="bold" text-anchor="middle">Grandparent</text>
    <text x="122" y="88" font-size="11" fill="#5d6675" text-anchor="middle">the creator's funding coin</text>

    <rect x="292" y="44" width="216" height="60" rx="3" fill="#ffffff" stroke="#7a8394" stroke-width="1.5"/>
    <text x="400" y="66" font-size="12.5" font-weight="bold" text-anchor="middle">Reserve launcher</text>
    <text x="400" y="83" font-size="11" fill="#5d6675" text-anchor="middle">creates one coin at the hash it</text>
    <text x="400" y="97" font-size="11" fill="#5d6675" text-anchor="middle">is given, for its whole amount</text>

    <rect x="580" y="44" width="196" height="60" rx="3" fill="#e9f2ef" stroke="#2d6b59" stroke-width="1.5"/>
    <text x="678" y="70" font-size="12.5" font-weight="bold" text-anchor="middle">Reserve coin</text>
    <text x="678" y="88" font-size="11" fill="#2d6b59" text-anchor="middle">hinted with the launcher id</text>

    <line x1="220" y1="74" x2="288" y2="74" stroke="#5d6675" stroke-width="1.5" marker-end="url(#b)"/>
    <text x="254" y="66" font-size="10.5" fill="#5d6675" text-anchor="middle">creates</text>
    <line x1="508" y1="74" x2="576" y2="74" stroke="#5d6675" stroke-width="1.5" marker-end="url(#b)"/>
    <text x="542" y="66" font-size="10.5" fill="#5d6675" text-anchor="middle">creates</text>

    <rect x="236" y="136" width="328" height="60" rx="3" fill="#fdf6ec" stroke="#8c6a2f" stroke-width="1.4"/>
    <text x="400" y="155" font-size="11" font-weight="bold" text-anchor="middle" fill="#8c6a2f">CreateCoinAnnouncement</text>
    <text x="400" y="172" font-size="10" text-anchor="middle" fill="#8c6a2f" font-family="DejaVu Sans Mono, Consolas, monospace">"forge-reserve-v14" + tree_hash(</text>
    <text x="400" y="187" font-size="10" text-anchor="middle" fill="#8c6a2f" font-family="DejaVu Sans Mono, Consolas, monospace">created_puzzle_hash, amount, launcher_id)</text>
    <line x1="400" y1="104" x2="400" y2="132" stroke="#8c6a2f" stroke-width="1.4" marker-end="url(#bo)"/>

    <rect x="120" y="228" width="560" height="110" rx="3" fill="#ffffff" stroke="#2d6b59" stroke-width="1.8"/>
    <text x="400" y="251" font-size="12.5" font-weight="bold" text-anchor="middle">register, in the same transaction</text>
    <text x="400" y="276" font-size="11.5" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace">P_i = coinid(grandparent_i, launcher_hash_i, reserves[i])</text>
    <text x="400" y="298" font-size="11" fill="#2d6b59" text-anchor="middle" font-weight="bold">asserts that announcement from P_i</text>
    <text x="400" y="314" font-size="11" fill="#2d6b59" text-anchor="middle">building the message from the reserve hash IT derives</text>
    <text x="400" y="330" font-size="10.5" fill="#5d6675" text-anchor="middle">the grandparent is given; neither the reserve's id nor its hash is named</text>

    <line x1="430" y1="228" x2="430" y2="200" stroke="#2d6b59" stroke-width="1.8" marker-end="url(#bg)"/>
    <text x="440" y="218" font-size="10.5" fill="#2d6b59">asserts</text>

    <text x="24" y="360" font-size="10.5" fill="#5d6675">Deriving P_i binds WHICH coin announced. The message binds WHAT it did: without a message committing to the</text>
    <text x="24" y="374" font-size="10.5" fill="#5d6675">created hash, a launcher could fund some other coin, announce it truthfully, and take the market key anyway.</text>
  </g>
</svg>
